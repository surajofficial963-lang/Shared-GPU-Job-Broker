{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gpu-broker.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "gpu-broker.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.allowedNamespaceLabel }}: "true"
      ports:
        - protocol: TCP
          port: 8080
  {{- if or .Values.postgres.egressCIDR .Values.clickhouse.url }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.postgres.egressCIDR }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.postgres.port }}
    {{- end }}
    {{- if .Values.clickhouse.url }}
    - to:
        - ipBlock:
            cidr: {{ required "clickhouse.egressCIDR is required when archiving is enabled" .Values.clickhouse.egressCIDR | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.clickhouse.port }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
